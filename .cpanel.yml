---
deployment:
  tasks:
    # Only needed when the git clone is NOT the web root. When the repo lives directly in
    # public_html, "Update from Remote" already makes the files live and this does nothing.
    # Never deletes anything on the server and never touches inc/config.php.
    - export DEPLOYPATH=$HOME/public_html/
    - if [ "$(pwd -P)" != "$(cd $DEPLOYPATH && pwd -P)" ]; then /bin/rsync -rlptD --exclude='.git' --exclude='.gitignore' --exclude='.cpanel.yml' --exclude='inc/config.php' --exclude='db/' --exclude='*.md' ./ $DEPLOYPATH; fi
